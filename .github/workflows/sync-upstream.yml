name: Sync upstream

on:
  schedule:
    # Daily, early enough to keep the fork current without needlessly
    # competing with daytime release builds.
    - cron: "17 03 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Leicas/OpenNeato.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains upstream/main"
            exit 0
          fi
          git merge --no-edit upstream/main
          git push origin HEAD:main
